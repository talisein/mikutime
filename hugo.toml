baseURL = "https://mikutime.link/"
locale = "en-us"
title = "Miku Timezone Resources"

# The site has no posts, so no feeds or taxonomy pages.
disableKinds = ["taxonomy", "term", "rss"]

[params]
# Static concert JSON the timetable, songs and setlists pages read.
concertData = "https://concert-data.39music.dance/"
description = "Timezone-related resources for Hatsune Miku events, such as Magical Mirai and Digital Stars. Fan-made website, not affiliated with Crypton Future Media."

