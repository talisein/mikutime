name: Build and deploy

# Builds the Hugo site and publishes it with script/deploy. Pushes to main
# go to production; other branches get a preview deployment.
on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: meiko
    container:
      image: registry.fedoraproject.org/fedora-minimal:44

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          # ca-certificates' %posttrans fails on the runner's read-only trust
          # mount and takes the transaction with it (mksystem
          # meiko/notes/ci-trust.md).
          printf 'excludepkgs=ca-certificates\n' >> /etc/dnf/dnf.conf
          microdnf -y install --setopt=install_weak_deps=0 git-core hugo nodejs-npm

      - name: Checkout
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.miku/${{ github.repository }}.git" .

      - name: Build
        run: |
          set -euo pipefail
          hugo version
          hugo --minify

      - name: Deploy
        env:
          DEPLOY_TARGET: cloudflare-pages
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: script/deploy
